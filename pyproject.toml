[project]
name = "pagevet"
version = "0.5.0"
description = "Find text in web pages aimed at AI models (indirect prompt injection), and check which AI crawlers may read them. Severity, advice and SARIF output."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Joseph Zulick" }]
keywords = ["prompt-injection", "ai-security", "llm", "seo", "geo", "sarif", "robots-txt", "ai-crawlers"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = ["httpx>=0.27", "defusedxml>=0.7"]

[project.urls]
Homepage = "https://github.com/j-zulick/pagevet"
Source = "https://github.com/j-zulick/pagevet"
Issues = "https://github.com/j-zulick/pagevet/issues"
Changelog = "https://github.com/j-zulick/pagevet/blob/main/CHANGELOG.md"

[project.optional-dependencies]
classifier = ["transformers>=4.40", "torch>=2.2"]
jev = ["typesafe-sdk>=0.7.5,<0.8"]
mcp = ["mcp>=2.3,<3"]
pdf = ["pypdf>=5"]
langfuse = ["langfuse>=3"]
otel = ["opentelemetry-sdk>=1.25", "opentelemetry-exporter-otlp-proto-http>=1.25"]
ocr = ["rapidocr-onnxruntime>=1.3"]

[project.scripts]
pagevet = "pagevet.scan:main"
pagevet-bench = "pagevet.bench:main"
pagevet-mcp = "pagevet.mcp_server:main"
pagevet-discover = "pagevet.discover:main"
pagevet-study = "pagevet.study:main"
pagevet-access = "pagevet.access:main"
pagevet-rules = "pagevet.rules:main"
pagevet-view = "pagevet.view:main"
pagevet-reproduce = "pagevet.reproduce:main"
pagevet-guard = "pagevet.guard:main"
pagevet-serve = "pagevet.serve:main"

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.8", "jsonschema>=4", "pypdf>=5"]
# Only for tests/test_explore_browser.py: drives an installed Chrome; never a runtime dependency.
browser = ["playwright>=1.48"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["src/pagevet", "tests", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["src/pagevet"]

[tool.ruff]
line-length = 150
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "T20"]
ignore = ["E501", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
